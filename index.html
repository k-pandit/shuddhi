<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shuddhi prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Noto+Sans+Bengali:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Serif:wght@400;700&family=Noto+Serif+Bengali:wght@400;700&family=Noto+Serif+Devanagari:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#D9DFE5; --paper:#FFFFFF; --ink:#1B1F24; --muted:#5A6470; --line:#C9D1DA;
  --chrome:#22303D; --chrome-2:#33465A;
  --red:#C21F32; --red-soft:#FCE9EB; --blue:#2851B5; --blue-soft:#E8EEFB;
  --qy:#7A5A00; --qy-soft:#FFF4D6; --done:#1D7A4C; --done-soft:#E3F3EA; --focus:#E8A317;
  --serif:"Noto Serif","Noto Serif Bengali","Noto Serif Devanagari",Georgia,serif;
  --sans:"Noto Sans","Noto Sans Bengali","Noto Sans Devanagari",system-ui,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--desk);color:var(--ink);font:400 15px/1.5 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}

.notice{background:#11181F;color:#DCE3EA;font-size:13px;padding:6px 16px;text-align:center}
header.bar{background:var(--chrome);color:#fff;padding:12px 24px;display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-size:20px;letter-spacing:.01em}
.brand span{font-family:"Noto Sans Bengali",sans-serif;color:#F6B8C0}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{all:unset;cursor:pointer;padding:7px 14px;border-radius:4px;color:#C9D4DF}
.tabs button:hover{background:var(--chrome-2);color:#fff}
.tabs button[aria-selected="true"]{background:#fff;color:var(--chrome);font-weight:700}
.tabs button:focus-visible{outline:3px solid var(--focus)}
.progress{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:#C9D4DF}
.progress .track{width:140px;height:6px;background:var(--chrome-2);border-radius:3px;overflow:hidden}
.progress .fill{height:100%;background:#7FD1A6}

.wrap{max-width:1360px;margin:0 auto;padding:20px 24px 48px}
.docbar{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;margin-bottom:16px}
.docbar h1{font:700 22px/1.25 var(--sans);margin:0}
.docbar .meta{color:var(--muted);font-size:13px;margin-top:2px}
.langs{display:flex;gap:6px;flex-wrap:wrap}
.lang{font-size:12px;padding:2px 9px;border-radius:999px;background:#fff;border:1px solid var(--line)}
.tools{display:flex;flex-wrap:wrap;gap:8px}

.btn{cursor:pointer;border:1px solid var(--chrome);background:var(--chrome);color:#fff;padding:7px 13px;border-radius:4px;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--chrome-2)}
.btn.ghost{background:#fff;color:var(--chrome)}
.btn.ghost:hover{background:#F1F4F7}
.btn.red{background:var(--red);border-color:var(--red)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.split{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
.split>*{min-width:0}

/* Galley proof */
.galley{background:var(--paper);box-shadow:0 1px 0 #B9C3CD,0 8px 24px -12px rgba(34,48,61,.35);padding:36px 0 40px;position:relative}
.galley-head{display:flex;justify-content:space-between;gap:12px;padding:0 40px 14px;margin-bottom:18px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.row{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:0}
.txt{padding:4px 28px 4px 40px;font:400 17px/1.85 var(--serif);border-right:1px solid #E7EBEF}
.row.h .txt{text-align:center;font-weight:700;letter-spacing:.02em}
.row.c .txt{text-align:center;font-size:15px}
.row.h2 .txt{font-weight:700;margin-top:18px;padding-top:14px;border-top:1px dashed var(--line)}
.row.li .txt{padding-left:64px}
.row.sig .txt{text-align:right;font-style:italic}
.margin{padding:6px 10px;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.mm{all:unset;cursor:pointer;display:inline-flex;gap:6px;align-items:baseline;font:600 13px/1.3 var(--sans);padding:1px 6px;border-radius:3px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mm:focus-visible{outline:3px solid var(--focus)}
.mm.r{color:var(--red)} .mm.b{color:var(--blue)} .mm.q{color:var(--qy)}
.mm:hover{background:#F2F4F6}
.n{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;font:700 11px/1 var(--sans);color:#fff;padding:0 4px}
.r .n,.n.r{background:var(--red)} .b .n,.n.b{background:var(--blue)} .q .n,.n.q{background:var(--qy)} .n.ok{background:var(--done)}

.mk{border-radius:2px;cursor:pointer}
.mk del{color:var(--red);text-decoration:line-through;text-decoration-thickness:2px}
.mk ins{text-decoration:none;border-bottom:2px solid currentColor;margin-left:1px}
.mk.r ins{color:var(--red)} .mk.b del{color:var(--blue)} .mk.b ins{color:var(--blue)}
.mk.b del{text-decoration-style:solid}
.mk.q .qtext{background:var(--qy-soft);border-bottom:2px wavy var(--qy)}
.mk sup{font:700 10px/1 var(--sans);margin-left:2px;vertical-align:super}
.mk.r sup{color:var(--red)} .mk.b sup{color:var(--blue)} .mk.q sup{color:var(--qy)}
.mk.focus{outline:2px solid var(--focus);outline-offset:2px}
.acc{background:var(--done-soft);border-radius:2px}
.ws{color:#9AA4AF;font-family:var(--sans);font-size:.8em}

.stamp{position:absolute;top:56px;right:190px;transform:rotate(-8deg);border:3px double var(--red);color:var(--red);padding:6px 14px;font:700 14px/1.2 var(--sans);letter-spacing:.06em;text-align:center;background:rgba(255,255,255,.85);pointer-events:none}
.stamp small{display:block;font-weight:600;letter-spacing:0;font-size:11px}

/* Marks panel */
.panel{background:#fff;border:1px solid var(--line);border-radius:6px;position:sticky;top:12px;max-height:calc(100vh - 24px);display:flex;flex-direction:column}
.panel-head{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.panel-head h2{font:700 16px/1.3 var(--sans);margin:0 0 10px}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button{all:unset;cursor:pointer;font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid var(--line)}
.filters button[aria-pressed="true"]{background:var(--chrome);color:#fff;border-color:var(--chrome)}
.filters button:focus-visible{outline:3px solid var(--focus)}
.bulk{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.list{overflow:auto;padding:6px 0}
.card{padding:12px 16px;border-bottom:1px solid #EEF1F4}
.card.focus{background:#FFF9E8}
.card .top{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
.card .top b{color:var(--ink);font-size:14px}
.card .chg{font:400 16px/1.6 var(--serif);margin:6px 0 4px;word-break:break-word}
.card .chg del{color:var(--red)} .card.b .chg del{color:var(--blue)}
.card .chg ins{text-decoration:none;font-weight:700}
.card .why{font-size:13px;color:var(--muted);margin:0 0 8px}
.card .acts{display:flex;gap:6px;flex-wrap:wrap}
.card .state{font-size:13px;font-weight:600}
.state.accepted{color:var(--done)} .state.rejected{color:var(--muted)}
.empty{padding:18px 16px;color:var(--muted)}

/* Generic panels */
.sheet{background:#fff;border:1px solid var(--line);border-radius:6px;padding:20px 22px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cols>*{min-width:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
textarea,input[type=text],select{padding:9px 10px;border:1px solid #B4BEC9;border-radius:4px;background:#fff;color:var(--ink);min-width:0}
textarea{font:400 16px/1.6 var(--serif);min-height:150px;resize:vertical;width:100%}
.diffout{font:400 16px/1.9 var(--serif);background:#fff;border:1px solid var(--line);border-radius:4px;padding:14px 16px;white-space:pre-wrap;word-break:break-word}
.d-del{background:var(--red-soft);color:var(--red);text-decoration:line-through}
.d-ins{background:var(--blue-soft);color:var(--blue);border-bottom:2px solid var(--blue)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid #E6EAEE;vertical-align:top}
th{color:var(--muted);font-size:13px;background:#F7F9FA}
.tbl{overflow-x:auto;position:relative}
.risk{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.risk.hi{background:var(--red-soft);color:var(--red)} .risk.lo{background:#EEF1F4;color:var(--muted)}
.hint{font-size:13px;color:var(--muted)}
.err{color:var(--red);font-size:13px;min-height:1.2em;margin:6px 0 0}
h2.s{font:700 18px/1.3 var(--sans);margin:0 0 6px}
p.lede{color:var(--muted);margin:0 0 16px;max-width:72ch}

dialog{border:0;border-radius:8px;padding:0;width:min(760px,calc(100% - 32px));color:var(--ink)}
dialog::backdrop{background:rgba(17,24,31,.55)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font:700 18px/1.3 var(--sans)}
.db{padding:16px 20px 20px}
.x{all:unset;cursor:pointer;font-size:22px;padding:0 8px;border-radius:4px}
.x:focus-visible{outline:3px solid var(--focus)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--chrome);color:#fff;padding:11px 18px;border-radius:6px;max-width:min(560px,calc(100% - 32px));opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

@media (max-width:1080px){ .split{grid-template-columns:minmax(0,1fr)} .panel{position:static;max-height:none} .stamp{right:24px} }
@media (max-width:700px){
  header.bar{padding:10px 16px} .progress{margin-left:0;width:100%} .progress .track{flex:1}
  .wrap{padding:14px 16px 40px}
  .galley{padding:20px 0 24px}
  .galley-head{padding:0 16px 10px}
  .row{grid-template-columns:minmax(0,1fr)}
  .txt{padding:2px 16px;border-right:0;font-size:16px}
  .row.li .txt{padding-left:28px}
  .margin{flex-direction:row;flex-wrap:wrap;padding:0 16px 6px}
  .margin:empty{display:none}
  .cols{grid-template-columns:1fr}
  .stamp{top:12px;right:12px}
}
@media (prefers-reduced-motion:reduce){ .toast{transition:none} }
</style>
</head>
<body>
<div class="notice">Prototype for the NE Seva First Innovation Challenge 2026. The document is synthetic test text, not a real notification.</div>
<header class="bar">
  <div class="brand"><b>Shuddhi</b><span lang="as">শুদ্ধি</span></div>
  <div class="tabs" role="tablist" aria-label="Sections">
    <button role="tab" data-tab="review" aria-selected="true">Proof review</button>
    <button role="tab" data-tab="compare" aria-selected="false">Compare copy and proof</button>
    <button role="tab" data-tab="revise" aria-selected="false">Revise-proof check</button>
    <button role="tab" data-tab="approve" aria-selected="false">Approval and history</button>
  </div>
  <div class="progress" id="progress"></div>
</header>
<div class="wrap" id="app"></div>

<dialog id="dlg" aria-labelledby="dlgT"><div id="dlgC"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ================= Sample document (synthetic) ================= */
const SAMPLE_TITLE = 'Notification TAD.45/2026/12, first proof';
const RAW = [
 ['h','GOVERNMENT OF ASSAM'],
 ['h','DEPARTMENT OF TRIBAL AFFAIRS (PLAIN)'],
 ['h','NOTIFICATION'],
 ['c','No. TAD.45/2026/12, Dated Dispur, the 19th November, 2026'],
 ['p','In pursuance of the the decision taken in the review meeting held on 12-11-2026, a District Level Stationery Monitoring Commitee is hereby constituted in each district  with the following members :'],
 ['li','1. Deputy Commissioner of the district – Chairman'],
 ['li','2. Additional Deputy Commissioner (Supply) – Member Secretary'],
 ['li','3. District Treasury Officer – Member'],
 ['li','5. Representative of the Directorate of Printing and Stationery – Member'],
 ['p','The Committee shall meet once in every three months and shall ensure that all members attends the meeting. The Deputy commissioner, Kamrup Metro shall submit the first report to the Department by 30th November , 2026.'],
 ['p','Members shall recieve no additional remuneration for this work. An annual contingency grant of ₹ 50,000  (Rupees fifty thousand) only is sanctioned under Rule 7 (vii). Correspondence may be addressed to the Gauhati office of the Directorate, near Gauhati High Court.'],
 ['p','In the notification No. TAD.40/2026/3, for “Commitee” read “Committee”.'],
 ['p','This notification shall come into force with immediate effect.'],
 ['sig','Sd/- Sample Officer, Secretary to the Government of Assam, Department of Tribal Affairs (Plan), Dispur'],
 ['h2','অসমীয়া সংস্কৰণ'],
 ['p','অসম চ{RA}কা{RA}ে প্ৰতিখন জিলাত লেখন সামগ্ৰীৰ যোগান তদাৰক কৰিবলৈ এখন সমিতি গঠন কৰিছে ।'],
 ['p','জিলা আ{YYA}ুক্ত সমিতিৰ সভাপতি হ’ব|'],
 ['p','সমিতিখনে প্ৰতি তিনি মাহত এবাৰ বৈঠকত মিলিত হ’ব আৰু ২০২৬ চনৰ 30 নৱেম্বৰৰ ভিতৰত প্ৰথম প্ৰতিবেদন দাখিল কৰিব।'],
 ['p','এই এই জাননী তৎক্ষণাৎ বলবৎ হ’ব।'],
 ['h2','বাংলা সংস্করণ'],
 ['p','এই বিজ্ঞপ্তি অবিলম্বে কার্যকর হবে এবং সকল জেলায় পাঠানো হবে।'],
 ['h2','हिन्दी संस्करण'],
 ['p','यह अधिसूचना तत्काल प्रभाव से लागू होगी |'],
 ['p','यह काम धीरे धीरे आगे बढ़ेगा।']
];
// Normalise everything, then inject the deliberate errors with exact code points.
const SAMPLE = RAW.map(([s,t]) => ({s, t: t.normalize('NFC').replace(/\{RA\}/g,'র').replace(/\{YYA\}/g,'য়')}));
// Pre-computed AI (blue pencil) suggestions for the sample only.
const SAMPLE_AI = [
  {p:9, find:'once in every three months', to:'once every three months', why:'Style: “once every three months” is the standard phrasing in notifications.'},
  {p:9, find:'attends', to:'attend', why:'Grammar: the plural subject “all members” takes “attend”.'},
  // A deliberately unsafe AI suggestion: it would change an amount. The guard must block it.
  {p:10, find:'₹ 50,000', to:'₹ 5,000', why:'(Unsafe AI rewrite, kept in the sample to show the guard working.)'}
];
const COPY_SAMPLE = 'The Committee shall be provided an annual contingency grant of ₹ 50,000 (Rupees fifty thousand) only, to be drawn from the District Stationery Fund.\nসমিতিখনে প্ৰতি তিনি মাহত এবাৰ বৈঠকত মিলিত হ’ব।'.normalize('NFC');
const PROOF_SAMPLE = 'The Committee shall be provided an annual grant of ₹ 5,000 (Rupees fifty thousand) only, to be drawn from the District Stationery Fund Fund.\nসমিতিখনে প্ৰতি দুই মাহত এবাৰ বৈঠকত মিলিত হ’ব।'.normalize('NFC');

/* ================= Rule engine (red pencil + queries) ================= */
const LANG_NAME = {en:'English', as:'Assamese', bn:'Bengali', hi:'Hindi', uncertain:'Language uncertain'};
/* Language is declared per document and CONFIRMED per paragraph (same logic as shuddhi_core/langid.py).
   র in place of ৰ is the commonest Assamese error, so the missing letter cannot be the only evidence:
   we also look for function words that differ between Assamese and Bengali. If unsure, abstain. */
const AS_WORDS = new Set(['আৰু','হৈছে','তেওঁ','তেওঁলোক','বাবে','লৈ','কাৰণে','অনুসৰি','নহয়','আছিল',"হ'ব",'হ’ব','কৰিছে','এখন','সকলো','জনোৱা','ক্ষেত্ৰত','সন্দৰ্ভত','মাজত','সৈতে','যোৱা','কৰিবলৈ','হোৱা'].map(w=>w.normalize('NFC')));
const BN_WORDS = new Set(['এবং','হবে','থেকে','জন্য','সঙ্গে','হয়েছে','কৰেছে','তাঁৰ','তাদেৰ','দ্বাৰা','কোনো','এখানে','যাবে','পাৰে','দেওয়া','হলো','হল','সকল','পাঠানো'].map(w=>w.normalize('NFC')));
function detectLang(t, declared){
  const beng = (t.match(/[ঀ-৿]/g)||[]).length, deva = (t.match(/[ऀ-ॿ]/g)||[]).length, latn = (t.match(/[A-Za-z]/g)||[]).length;
  if (beng >= deva && beng >= latn && beng > 0){
    const words = (t.match(/[ঀ-৿'’]+/g)||[]).map(w=>w.normalize('NFC').replace(/র/g,'ৰ'));
    const as = words.filter(w=>AS_WORDS.has(w)).length, bn = words.filter(w=>BN_WORDS.has(w)).length, letters = /[ৰৱ]/.test(t);
    if (declared==='bn') return letters ? 'uncertain' : 'bn';
    if (bn && !(as||letters)) return 'bn';
    if ((as||letters) && !bn) return 'as';
    return 'uncertain';
  }
  if (deva >= latn && deva > 0) return 'hi';
  return latn ? 'en' : 'uncertain';
}

/* ---------- Protected tokens and zones (same rules as shuddhi_core/guard.py and zones.py) ---------- */
const DIG='0-9০-৯०-९';
const PROTECTED = [
  ['amount', new RegExp(`(?:₹|Rs\\.?|INR)\\s*[${DIG}][${DIG},]*(?:\\.[${DIG}]+)?(?:\\s*/-)?`,'gi')],
  ['date', new RegExp(`(?<![${DIG}])[${DIG}]{1,4}[-/.][${DIG}]{1,2}[-/.][${DIG}]{2,4}(?![${DIG}])`,'g')],
  ['date', /\b\d{1,2}(?:st|nd|rd|th)?\s+(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*\.?,?\s+\d{4}\b/g],
  ['reference', new RegExp(`\\b(?:No|Nos|Memo|Letter|File|ECF)\\s*\\.?\\s*:?\\s*[A-Z][A-Za-z().&-]*\\s*\\.?\\s*[${DIG}][\\w./()-]*`,'gi')],
  ['section', new RegExp(`\\b(?:Section|Sec\\.|Rule|Rules|Clause|Article|Para|Paragraph|Schedule|Chapter)\\s*[${DIG}]+[A-Za-z]?(?:\\s*\\([0-9a-zivx]+\\))*`,'gi')],
  ['number', new RegExp(`[${DIG}](?:[${DIG},.]*[${DIG}])?`,'g')]
];
const ZONES = [
  ['quotation', /["“‘'][^"”’'\n]{1,200}["”’']/g],
  ['corrigendum', /\b[Ff]or\s+["“‘']?[^\n]{1,80}?["”’']?\s+read\s+["“‘']?[^\n]{1,80}?["”’']?(?=[.;,]|\s*$)/g],
  ['citation', /\b(?:[A-Z][\w()&'-]*\s+){1,9}(?:Act|Rules|Regulations|Order|Ordinance|Code)(?:,?\s*\d{4})?/g],
  ['institution', /\b(?:[A-Z][\w&'-]*\s+){0,6}(?:High Court|Supreme Court|University|Municipal Corporation|Corporation|Commission|Board|Council|Tribunal|Authority)\b/g]
];
const spansOf = (t, list) => { const out=[]; for (const [k,re] of list) for (const m of t.matchAll(re)) if (m[0].length) out.push({s:m.index,e:m.index+m[0].length,k}); return out; };
const digitsOf = s => (s.replace(/[০-৯]/g,d=>'০১২৩৪৫৬৭৮৯'.indexOf(d)).replace(/[०-९]/g,d=>'०१२३४५६७८९'.indexOf(d)).match(/[0-9]+/g)||[]).join('|');
/* Every mark passes this guard. A mark touching a protected token or zone becomes a query (never applied);
   a mark whose replacement would change a number is blocked. */
function guard(t, f){
  const toks = spansOf(t, PROTECTED), zones = spansOf(t, ZONES);
  const hitT = toks.find(p=>f.start<p.e && p.s<f.end), hitZ = zones.find(z=>f.start<z.e && z.s<f.end);
  if (f.to!==null && f.to!==undefined && digitsOf(t.slice(f.start,f.end)) !== digitsOf(f.to)) return {...f, blocked:true};
  if (hitT || hitZ) return {...f, kind:'q', bulk:false, locked:true, to:null,

function check(paras, bengLang, ai){
  const marks = []; blocked = [];

    (ai||[]).filter(a=>a.p===pi).forEach(a => { const s = p.t.indexOf(a.find); if (s>=0) f.push({start:s,end:s+a.find.length,to:a.to,why:a.why,rule:'AI',kind:'b',bulk:false,pr:50}); });

    f.filter(x=>x.blocked).forEach(x=>blocked.push({...x, p:pi, from:p.t.slice(x.start,x.end)}));
    f = f.filter(x=>!x.blocked);
    f.sort((a,b)=>a.start-b.start || a.pr-b.pr);
    let last = -1; f.forEach(x => { if (x.start >= last){ marks.push({...x, p:pi}); last = x.end; } });

  paras.forEach((p,pi)=>{ for (const m of p.t.matchAll(/\(([A-Za-z][A-Za-z .&-]{2,30})\)/g)) (occ[m[1].toLowerCase()] ||= []).push({p:pi,s:m.index+1,e:m.index+1+m[1].length,g:m[1]}); });

  return `<div class="card ${m.kind}${ui.focus===m.id?' focus':''}" id="card-${m.id}">
    <div class="top"><span class="n ${m.status==='open'?m.kind:'ok'}">${m.id}</span><b>${esc(RULE_NAME[m.rule])}</b><span>${m.locked?'🔒 Locked query':kindName[m.kind]}, ${lang}</span></div>
    <div class="chg" lang="${D.paras[m.p].lang}">${chg}</div><p class="why">${esc(m.why)}</p><div class="acts">${acts}</div></div>`;
}

/* ---------- Compare ---------- */
let cmp = {copy:COPY_SAMPLE, proof:PROOF_SAMPLE};
function vCompare(){
  return `<h2 class="s">Compare the department’s copy with the typeset proof</h2>
  <p class="lede">The copy holder’s job, done automatically: every word that was dropped, added or changed during typesetting is listed. Changed numbers, amounts and number words are flagged as high risk.</p>
  <div class="cols">
    <label class="f">Original copy from the department<textarea id="c-copy">${esc(cmp.copy)}</textarea></label>
    <label class="f">Typeset proof<textarea id="c-proof">${esc(cmp.proof)}</textarea></label>
  </div>
  <div style="margin:12px 0 18px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="compare">Compare</button><button class="btn ghost" data-act="cmp-sample">Restore sample</button></div>
  <div id="c-out"></div>`;
}
const NUMWORDS = new Set(['one','two','three','four','five','six','seven','eight','nine','ten','hundred','thousand','lakh','lakhs','crore','crores','এক','দুই','চাৰি','পাঁচ','ছয়','সাত','আঠ','ন','দহ','এশ','হাজাৰ','লাখ','কোটি','एक','दो','तीन','चार','पांच','पाँच','छह','सात','आठ','नौ','दस','सौ','हज़ार','हजार','लाख','करोड़'].map(w=>w.normalize('NFC')));
const isNumTok = w => /[0-9০-৯०-९]/.test(w) || NUMWORDS.has(w.replace(/[^\p{L}\p{M}]/gu,'').toLowerCase());
function diffTokens(a,b){
  const n=a.length, m=b.length, dp=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for (let i=n-1;i>=0;i--) for (let j=m-1;j>=0;j--) dp[i][j] = a[i]===b[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j],dp[i][j+1]);
  const ops=[]; let i=0,j=0;
  while (i<n && j<m){ if (a[i]===b[j]){ ops.push({op:'eq',t:b[j]}); i++; j++; } else if (dp[i+1][j]>=dp[i][j+1]) ops.push({op:'del',t:a[i++]}); else ops.push({op:'ins',t:b[j++]}); }
  while (i<n) ops.push({op:'del',t:a[i++]}); while (j<m) ops.push({op:'ins',t:b[j++]});
  return ops;
}
function runCompare(fromBtn){
  if (fromBtn){ cmp.copy=$('#c-copy').value; cmp.proof=$('#c-proof').value; }
  const tok = s=>s.normalize('NFC').replace(/\r?\n/g,' \n ').split(/[ \t]+/).filter(Boolean);
  const ops = diffTokens(tok(cmp.copy), tok(cmp.proof));
  const groups=[]; let g=null;
  ops.forEach(o=>{ if (o.op==='eq' || o.t==='\n'){ g=null; return; } if(!g){ g={copy:[],proof:[]}; groups.push(g);} (o.op==='del'?g.copy:g.proof).push(o.t); });
  const shown = ops.filter(o=>!(o.t==='\n' && o.op==='del')).map(o=> o.t==='\n' ? '\n' : o.op==='eq'?esc(o.t): o.op==='del'?`<span class="d-del">${esc(o.t)}</span>`:`<span class="d-ins">${esc(o.t)}</span>`).join(' ').replace(/ ?\n ?/g,'\n');
  const rows = groups.map((g,i)=>{ const hi=[...g.copy,...g.proof].some(isNumTok); const type = !g.proof.length?'Dropped in proof':!g.copy.length?'Added in proof':'Changed';
    return `<tr><td>${i+1}</td><td>${type}</td><td>${esc(g.copy.join(' '))||'<span class="hint">nothing</span>'}</td><td>${esc(g.proof.join(' '))||'<span class="hint">nothing</span>'}</td><td><span class="risk ${hi?'hi':'lo'}">${hi?'High: number changed':'Check'}</span></td></tr>`; }).join('');
  const out = $('#c-out'); if (!out) return;
  out.innerHTML = groups.length ? `<div class="sheet" style="margin-bottom:16px"><h2 class="s">${groups.length} difference${groups.length>1?'s':''} found</h2><div class="tbl"><table><thead><tr><th>#</th><th>Type</th><th>Copy says</th><th>Proof says</th><th>Risk</th></tr></thead><tbody>${rows}</tbody></table></div></div>
    <h2 class="s">Proof with differences marked</h2><p class="hint">Red strike-through: in the copy but missing from the proof. Blue underline: in the proof but not in the copy.</p><div class="diffout">${shown}</div>`
    : `<div class="sheet"><h2 class="s">No differences</h2><p class="hint" style="margin:0">The proof matches the copy word for word.</p></div>`;
  if (fromBtn) toast(groups.length ? `${groups.length} difference${groups.length>1?'s':''} found.` : 'The proof matches the copy.');
}

/* ---------- Revise-proof check ---------- */
const REV_SAMPLE = {
  r1: 'The Governor of Assam is pleased to constitute a District Level Monitoring Commitee for the district of Kamrup Metro. The the Committee shall meet once in every quarter and shall recieve no remuneration. A sum of Rs. 5,00,000 is sanctioned for the year 2026-27.',
  acc: 'Monitoring Commitee => Monitoring Committee\nKamrup Metro => Kamrup (Metro)\nThe the Committee => The Committee\nshall recieve => shall receive',
  r2: 'The Governor of Assam is pleased to constitute a District Level Monitoring Committee for the district of Kamrup Metro. The Committee may meet once in every quarter and shall receive no remuneration. A sum of Rs. 50,000 is sanctioned for the year 2026-27.'
};
let rev = {...REV_SAMPLE};
function vRevise(){
  return `<h2 class="s">Check the revise proof against the last round</h2>
  <p class="lede">Today the reader re-reads the whole page at every revise. Shuddhi applies the corrections accepted on the last proof and compares the result with the new proof: every correction is shown as <b>made</b> or <b>missed</b>, and anything that changed without being asked for is listed first, numbers at the top.</p>
  <div class="cols">
    <label class="f">Proof, round 1<textarea id="r-1">${esc(rev.r1)}</textarea></label>
    <label class="f">Proof, round 2 (the revise)<textarea id="r-2">${esc(rev.r2)}</textarea></label>
  </div>
  <label class="f" style="margin-top:12px">Corrections accepted on round 1 (one per line: wrong => right)<textarea id="r-acc" style="min-height:90px">${esc(rev.acc)}</textarea></label>
  <div style="margin:12px 0 18px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-act="revise">Check the revise</button><button class="btn ghost" data-act="rev-sample">Restore sample</button></div>
  <div id="r-out"></div>`;
}
function runRevise(fromBtn){
  if (fromBtn){ rev = {r1:$('#r-1').value, r2:$('#r-2').value, acc:$('#r-acc').value}; }
  const acc = rev.acc.split(/\r?\n/).map(l=>l.split('=>').map(s=>s.trim())).filter(a=>a.length===2 && a[0]);
  let expected = rev.r1; acc.forEach(([f,t])=>{ expected = expected.replace(f,t); });
  const res = [];
  acc.forEach(([f,t])=>{ const made = rev.r2.includes(t) && (!rev.r2.includes(f) || t.includes(f)); res.push({type: made?'made':'missed', detail: made?`“${f}” → “${t}”`:`“${f}” should read “${t}”`, hi:/[0-9০-৯०-९]/.test(f+t), f, t}); });
  const missed = res.filter(r=>r.type==='missed');
  const tok = s=>s.normalize('NFC').split(/\s+/).filter(Boolean);
  const ops = diffTokens(tok(expected), tok(rev.r2)); const groups=[]; let g=null;
  ops.forEach(o=>{ if (o.op==='eq'){ g=null; return; } if(!g){ g={exp:[],got:[]}; groups.push(g);} (o.op==='del'?g.exp:g.got).push(o.t); });
  groups.forEach(g=>{ const e=g.exp.join(' ').replace(/[.,;:]+$/,''), t=g.got.join(' ').replace(/[.,;:]+$/,''); if (missed.some(m=>(e && m.t.includes(e)) || (t && m.f.includes(t)))) return;
    res.push({type:'unasked', detail:`expected “${e||'nothing'}” but the revise has “${t||'nothing'}”`, hi:[...g.exp,...g.got].some(isNumTok)}); });
  const order = {unasked:0, missed:1, made:2};
  res.sort((a,b)=>(b.hi-a.hi) || order[a.type]-order[b.type]);
  const n = k=>res.filter(r=>r.type===k).length;
  const lab = {made:'Made', missed:'Missed', unasked:'Not asked for'};
  const out = $('#r-out'); if (!out) return;
  out.innerHTML = `<div class="sheet"><h2 class="s">${n('made')} made · ${n('missed')} missed · ${n('unasked')} not asked for</h2><div class="tbl"><table><thead><tr><th>#</th><th>Result</th><th>Detail</th><th>Risk</th></tr></thead><tbody>${res.map((r,i)=>`<tr><td>${i+1}</td><td>${lab[r.type]}</td><td>${esc(r.detail)}</td><td>${r.type==='made'?'<span class="risk lo">OK</span>':`<span class="risk ${r.hi?'hi':'lo'}">${r.hi?'High: number changed':'Check'}</span>`}</td></tr>`).join('')}</tbody></table></div>
    <p class="hint" style="margin:10px 0 0">The reader now checks ${n('missed')+n('unasked')} place${n('missed')+n('unasked')===1?'':'s'} instead of re-reading the whole page. The same check runs on PDF proofs in <code>shuddhi_pdf.py diff</code>.</p></div>`;
  if (fromBtn) toast('Revise checked.');
}

/* ---------- Approval ---------- */
function vApprove(){
  const c = counts();
  const hist = D.history.map(h=>`<tr><td>${tstr(h.ts)}</td><td>${esc(h.doc)}</td><td>${esc(h.event)}</td><td>${esc(h.by)}</td><td>${h.acc??''}</td><td>${h.rej??''}</td><td><code>${esc(h.fp||'')}</code></td></tr>`).join('');
  return `<div class="cols">
    <section class="sheet">
      <h2 class="s">${D.approved?'Approved for print':'Approve for print'}</h2>
      ${D.approved ? `<p class="lede" style="margin-bottom:12px">Approved by ${esc(D.approved.by)} on ${tstr(D.approved.ts)}. Fingerprint <code>${esc(D.approved.fp)}</code> identifies this exact text; any later change produces a different fingerprint.</p>
        <button class="btn ghost" data-act="reopen">Reopen for correction</button>`
      : `<p class="lede" style="margin-bottom:12px">${c.open ? `Resolve every mark before approving. <b>${c.open}</b> of ${c.total} still open.` : 'Every mark is resolved. Record who approves this text for printing.'}</p>
        <div style="display:grid;gap:12px;max-width:420px">
          <label class="f">Approver’s name<input type="text" id="ap-name" placeholder="e.g. A. Baruah"></label>
          <label class="f">Designation<input type="text" id="ap-desig" placeholder="e.g. Reviser"></label>
        </div>
        <p class="err" id="ap-err" role="alert"></p>
        <button class="btn" data-act="approve" ${c.open?'disabled':''}>Approve for print</button>`}
    </section>
    <section class="sheet">
      <h2 class="s">This document</h2>
      <table><tbody>
        <tr><th>Document</th><td>${esc(D.title)}</td></tr>
        <tr><th>Marks accepted</th><td>${c.accepted}</td></tr>
        <tr><th>Marks rejected</th><td>${c.rejected}</td></tr>
        <tr><th>Marks open</th><td>${c.open}</td></tr>
        <tr><th>Outputs</th><td><button class="btn ghost sm" data-act="dl-text">Corrected text</button> <button class="btn ghost sm" data-act="dl-log">Change log (CSV)</button></td></tr>
      </tbody></table>
      <p class="hint">In the full system the outputs also include the original Word file with every accepted change as a tracked change, and a marked-up PDF proof.</p>
    </section>
  </div>
  <section class="sheet" style="margin-top:16px"><h2 class="s">History</h2>
    ${hist?`<div class="tbl"><table><thead><tr><th>When</th><th>Document</th><th>Event</th><th>By</th><th>Accepted</th><th>Rejected</th><th>Fingerprint</th></tr></thead><tbody>${hist}</tbody></table></div>`:'<p class="hint" style="margin:0">No approvals recorded yet.</p>'}
  </section>`;
}

/* ================= Actions ================= */
function setStatus(id, st){ const m=D.marks.find(x=>x.id===id); if(m) m.status=st; }
function focusMark(id){
  ui.focus=id; const m=D.marks.find(x=>x.id===id);
  if (m && ui.filter!=='all' && !(ui.filter==='open'&&m.status==='open') && !(ui.filter===m.kind&&m.status==='open') && !(ui.filter==='done'&&m.status!=='open')) ui.filter = m.status==='open'?'open':'done';
  render(); const c=$('#card-'+id); if(c){ c.scrollIntoView({block:'nearest',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}); }
}
const dlg=$('#dlg');
function openPaste(){
  $('#dlgC').innerHTML = `<div class="dh"><h2 id="dlgT">Check your own text</h2><button class="x" data-act="close" aria-label="Close">×</button></div>
  <div class="db"><p class="lede" style="margin-bottom:12px">Paste text in English, Assamese, Bengali or Hindi. One paragraph per line. The same rule engine checks it straight away. AI suggestions run on the server in the full system, so they are not shown for your text here.</p>
  <label class="f">Text<textarea id="p-text" placeholder="Paste or type here"></textarea></label>
  <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-top:12px">
    <label class="f">Bengali-script text is in<select id="p-lang"><option value="as">Assamese</option><option value="bn">Bengali</option></select></label>
    <button class="btn" data-act="run-paste">Check text</button>
  </div><p class="err" id="p-err" role="alert"></p></div>`;
  dlg.showModal(); $('#p-text').focus();
}
const A = {
  accept:id=>{ setStatus(+id,'accepted'); render(); },
  reject:id=>{ setStatus(+id,'rejected'); render(); },
  undo:id=>{ setStatus(+id,'open'); render(); },
  bulk:rule=>{ const n=D.marks.filter(m=>m.rule===rule&&m.bulk&&m.status==='open'); n.forEach(m=>m.status='accepted'); render(); toast(`${n.length} “${RULE_NAME[rule]}” fixes accepted. Undo any of them from its card.`); },
  paste:openPaste,
  close:()=>dlg.close(),
  'run-paste':()=>{ const t=$('#p-text').value.normalize('NFC'); const lines=t.split(/\r?\n/).map(s=>s.replace(/\s+$/,'')).filter(s=>s.trim()); if(!lines.length) return $('#p-err').textContent='Paste some text first.';
    D = newDoc('Your text', lines.map(l=>({s:'p',t:l})), $('#p-lang').value, null, 'pasted'); dlg.close(); ui.filter='open'; ui.focus=null; ui.tab='review'; render(); toast(`${D.marks.length} mark${D.marks.length===1?'':'s'} found.`); },
  sample:()=>{ D = newDoc(SAMPLE_TITLE, SAMPLE, 'as', SAMPLE_AI, 'sample'); ui.filter='open'; ui.focus=null; render(); },
  'dl-text':()=>{ download(`shuddhi-corrected-${Date.now()}.txt`, correctedText(), 'text/plain'); toast('Corrected text downloaded.'); },
  'dl-log':()=>{ const q=v=>`"${String(v??'').replace(/"/g,'""')}"`; const rows=[['Mark','Type','Rule','Language','Paragraph','Before','After','Reason','Decision']].concat(D.marks.map(m=>[m.id,kindName[m.kind],RULE_NAME[m.rule],LANG_NAME[D.paras[m.p].lang],m.p+1,m.from,m.to??'(query)',m.why,m.status]));
    download(`shuddhi-change-log-${Date.now()}.csv`, rows.map(r=>r.map(q).join(',')).join('\r\n'), 'text/csv'); toast('Change log downloaded.'); },
  compare:()=>runCompare(true),
  revise:()=>runRevise(true),
  'rev-sample':()=>{ rev={...REV_SAMPLE}; render(); },
  'cmp-sample':()=>{ cmp={copy:COPY_SAMPLE,proof:PROOF_SAMPLE}; render(); },
  approve:async ()=>{ const name=$('#ap-name').value.trim(), desig=$('#ap-desig').value.trim(); if(!name||!desig) return $('#ap-err').textContent='Enter the approver’s name and designation.';
    const c=counts(), fp=await sha256(correctedText()), by=`${name}, ${desig}`; D.approved={by,ts:Date.now(),fp};
    D.history.unshift({ts:Date.now(),doc:D.title,event:'Approved for print',by,acc:c.accepted,rej:c.rejected,fp}); render(); toast('Approved for print. The approval is recorded in the history.'); },
  reopen:()=>{ D.history.unshift({ts:Date.now(),doc:D.title,event:'Reopened for correction',by:'Current user',fp:D.approved.fp}); D.approved=null; render(); toast('Reopened. Marks can be changed again; a new approval will be needed.'); }
};
document.addEventListener('click',e=>{
  const tab=e.target.closest('[data-tab]'); if(tab){ ui.tab=tab.dataset.tab; render(); return; }
  const f=e.target.closest('[data-filter]'); if(f){ ui.filter=f.dataset.filter; render(); return; }
  const a=e.target.closest('[data-act]'); if(a && A[a.dataset.act]){ A[a.dataset.act](a.dataset.id); return; }
  const mk=e.target.closest('[data-mark]'); if(mk){ focusMark(+mk.dataset.mark); }
});
dlg.addEventListener('click',e=>{ if(e.target===dlg) dlg.close(); });
document.addEventListener('keydown',e=>{ if((e.key==='ArrowRight'||e.key==='ArrowLeft') && e.target.matches('[role=tab]')){ const tabs=[...document.querySelectorAll('[role=tab]')]; const i=tabs.indexOf(e.target); const n=tabs[(i+(e.key==='ArrowRight'?1:tabs.length-1))%tabs.length]; ui.tab=n.dataset.tab; render(); document.querySelector(`[data-tab="${ui.tab}"]`).focus(); }});

load(); render();
</script>
</body>
</html>
